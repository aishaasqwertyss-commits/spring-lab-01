<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Catalog</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Book Catalog</h1>
        <p>Spring MVC Laboratory Work No. 5</p>
    </div>

    <!-- Flash message -->
    <p
            th:if="${message}"
            class="flash"
            th:text="${message}">
    </p>

    <!-- Add new book -->
    <div class="filter">

        <h2>Add a new book</h2>

        <form method="post" action="/books">

            <label for="title">Title:</label>
            <input
                    id="title"
                    type="text"
                    name="title"
                    required>

            <label for="bookAuthor">Author:</label>
            <input
                    id="bookAuthor"
                    type="text"
                    name="author"
                    required>

            <label for="year">Year:</label>
            <input
                    id="year"
                    type="number"
                    name="year"
                    required>

            <button type="submit">Add Book</button>

        </form>

    </div>

    <!-- Author filter -->
    <div class="filter">

        <form method="get" action="/books">

            <label for="author">Filter by author:</label>

            <input
                    id="author"
                    type="text"
                    name="author"
                    th:value="${author}"
                    placeholder="Enter author">

            <button type="submit">Search</button>

            <a href="/books" class="reset">Reset</a>

        </form>

    </div>

    <!-- Books table -->
    <div class="books-section">

        <div
                th:if="${#lists.isEmpty(books)}"
                class="empty">

            No books found.

        </div>

        <table th:if="${!#lists.isEmpty(books)}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Year</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="book : ${books}">

                <td th:text="${book.id}">1</td>

                <td th:text="${book.title}">
                    Effective Java
                </td>

                <td th:text="${book.author}">
                    Joshua Bloch
                </td>

                <td th:text="${book.year}">
                    2018
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
