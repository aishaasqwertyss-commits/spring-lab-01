<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="#{book.new}">New Book</title>

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="container">

  <!-- Language switcher -->
  <div class="language-switcher">
    <a th:href="@{/books/new(lang='en')}">English</a>
    |
    <a th:href="@{/books/new(lang='ru')}">Русский</a>
  </div>

  <h1 th:text="#{book.new}">New Book</h1>

  <form th:action="@{/books}"
        th:object="${form}"
        method="post">

    <!-- Title -->
    <div>
      <label for="title" th:text="#{book.title}">Title</label>

      <input type="text"
             id="title"
             th:field="*{title}"
             th:errorclass="is-invalid">

      <div class="error"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
      </div>
    </div>

    <br>

    <!-- Author -->
    <div>
      <label for="author" th:text="#{book.author}">Author</label>

      <input type="text"
             id="author"
             th:field="*{author}"
             th:errorclass="is-invalid">

      <div class="error"
           th:if="${#fields.hasErrors('author')}"
           th:errors="*{author}">
      </div>
    </div>

    <br>

    <!-- Year -->
    <div>
      <label for="year" th:text="#{book.year}">Year</label>

      <input type="number"
             id="year"
             th:field="*{year}"
             th:errorclass="is-invalid">

      <div class="error"
           th:if="${#fields.hasErrors('year')}"
           th:errors="*{year}">
      </div>
    </div>

    <br>

    <!-- Genre -->
    <div>
      <label for="genre" th:text="#{book.genre}">Genre</label>

      <select id="genre"
              th:field="*{genre}"
              th:errorclass="is-invalid">

        <option value="" th:text="#{genre.select}">
          Select a genre
        </option>

        <option th:each="g : ${genres}"
                th:value="${g}"
                th:text="${g}">
        </option>

      </select>

      <div class="error"
           th:if="${#fields.hasErrors('genre')}"
           th:errors="*{genre}">
      </div>
    </div>

    <br>

    <!-- Cover Image URL: Individual Assignment, Variant 5 -->
    <div>
      <label for="coverImageUrl">Cover Image URL</label>

      <input type="url"
             id="coverImageUrl"
             th:field="*{coverImageUrl}"
             th:errorclass="is-invalid"
             placeholder="https://example.com/cover.jpg">

      <div class="error"
           th:if="${#fields.hasErrors('coverImageUrl')}"
           th:errors="*{coverImageUrl}">
      </div>
    </div>

    <br>

    <!-- Availability -->
    <div>
      <label>
        <input type="checkbox" th:field="*{available}">
        <span th:text="#{book.available}">Available</span>
      </label>
    </div>

    <br>

    <!-- Submit -->
    <button type="submit" th:text="#{form.submit}">Save</button>

  </form>

  <br>

  <a th:href="@{/books}" th:text="#{form.back}">Back to books</a>

</main>

</body>
</html>
