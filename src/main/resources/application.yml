spring:
  application:
    name: spring-lab

server:
  port: 8080

app:
  owner: Salamat Aisha
  group: IS-2405
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  ui:
    theme: LIGHT
    items-per-page: 10

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: ALWAYS

logging:
  level:
    kz.iitu: INFO